<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier S.L — Admin</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/votre-cloud-name/image/upload/v1788201002/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════ LOGIN ════ -->
<div id="login">
  <div class="login-card">
    <img src="https://res.cloudinary.com/votre-cloud-name/image/upload/v1788201002/logo.png" alt="Atelier S.L" class="login-logo-img">
    <h1 class="login-title">Atelier S.L</h1>
    <p class="login-sub">Administration</p>
    <div class="form-group"><label class="form-label">Email</label>
      <input class="form-input" type="email" id="inp-email" placeholder="admin@example.com"/>
    </div>
    <div class="form-group"><label class="form-label">Mot de passe</label>
      <input class="form-input" type="password" id="inp-pw" placeholder="••••••••"/>
    </div>
    <div id="login-err" class="err-msg"></div>
    <button class="btn-login" id="btn-login">Se connecter →</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ ADMIN PANEL ════ -->
<div id="admin">
  <div class="app-wrap">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-top">
        <div class="sb-logo-plate"><img src="https://res.cloudinary.com/votre-cloud-name/image/upload/v1788201002/logo.png" alt="Atelier S.L" class="sb-logo-img"></div>
        <div class="sb-brand">
          <h1>Atelier S.L</h1>
          <p>Administration</p>
        </div>
      </div>
      <div class="sb-divider"></div>
      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-footer">
        <div class="sb-user">
          <div class="sb-avatar" id="sbAvatar">AD</div>
          <div style="flex:1;min-width:0">
            <div class="sb-uname" id="sbName">Admin</div>
            <div class="sb-urole" id="sbRole">admin</div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Main -->
    <div class="main-area">
      <header class="topbar">
        <button class="sb-burger" id="sbBurger" onclick="toggleSidebar()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <div class="topbar-title" id="topbarTitle">Tableau de bord</div>
          <div class="topbar-sub">Style kabyle · Luxe et tradition</div>
        </div>
        <div class="topbar-right">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-txt" id="statusTxt">API connectée</span>
          <div class="vline"></div>
          <button class="btn-theme notif-bell" id="btnNotif" onclick="navigate('notifications')" title="Notifications">🔔<span id="notifBadge" class="notif-badge" style="display:none">0</span></button>
          <div class="vline"></div>
          <button class="btn-theme" id="btnTheme" onclick="toggleTheme()">🌙</button>
        </div>
      </header>
      <div class="content-area">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-produits"  class="page"></div>
        <div id="page-commandes" class="page"></div>
        <div id="page-clients"   class="page"></div>
        <div id="page-categories" class="page"></div>
        <div id="page-promos"    class="page"></div>
        <div id="page-avis"      class="page"></div>
        <div id="page-messages"  class="page"></div>
        <div id="page-newsletter" class="page"></div>
        <div id="page-stats"     class="page"></div>
        <div id="page-visiteurs" class="page"></div>
        <!-- page-stock removed -->
        <div id="page-utilisateurs" class="page"></div>
        <div id="page-parametres" class="page"></div>
        <div id="page-journaux"  class="page"></div>
        <div id="page-notifications" class="page"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="hideModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/main.js" defer></script>
</body>
</html>
